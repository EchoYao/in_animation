services:
  ai-animation:
    build: .
    image: ai-animation:latest
    container_name: ai-animation
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      # 可选：若用文件方式提供配置（与 .env 二选一，环境变量优先）
      - ./credentials.json:/app/credentials.json:ro
      # 持久化目录
      - ./.generated_html:/app/.generated_html
      - ./.recordings:/app/.recordings
      - ./output:/app/output
      - ./logs:/app/logs
    environment:
      # 从宿主机根目录 .env 读取注入（凭据不进镜像，运行时注入）
      - API_KEY=${API_KEY}
      - BASE_URL=${BASE_URL}
      - MODEL=${MODEL}
      - HOST=0.0.0.0
      - PORT=8000
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s